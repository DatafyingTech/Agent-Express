<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%EDITION_NAME% · Join</title>
    <meta name="theme-color" content="#F4F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-apple-touch.png" />
    <script>
      // The theme chosen in the app (Settings → Appearance), before anything paints.
      (function () {
        var t = 'auto';
        try {
          t = localStorage.getItem('hearth.theme') || 'auto';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t === 'light' || t === 'dark' ? t : 'auto');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@0;1&display=swap" />
    <link rel="stylesheet" href="./app/tokens.css" />
    <link rel="stylesheet" href="./door.css" />
  </head>
  <body>
    <main class="card">
      <div class="door-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path class="house" d="M13 29 32 13l19 16v20a4 4 0 0 1-4 4H17a4 4 0 0 1-4-4Z"/><path class="flame" d="M32 26c5 5.4 9 10 9 16.4a9 9 0 0 1-18 0c0-3.7 1.5-6.4 3.5-8.7.3 3 1.8 5 3.8 5.4-1.5-4.9 0-9.4 1.7-13.1Z"/></svg>
      </div>
      <p class="door-word">%EDITION_NAME%<span class="door-word__dot" aria-hidden="true"></span></p>
      <h1 id="title">You're invited</h1>
      <p class="sub" id="sub">Checking your invite…</p>
      <form id="form" hidden>
        <label>Your name<input id="name" type="text" maxlength="24" autocomplete="username" spellcheck="false" required /></label>
        <label>Pick a password<input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
        <label>Once more<input id="again" type="password" minlength="8" autocomplete="new-password" required /></label>
        <p class="note">At least 8 characters. It's yours alone: nobody else ever sees it.</p>
        <button type="submit" id="submit">Make my account</button>
      </form>
      <p id="error" class="error" role="alert"></p>
      <a id="login" href="/login" hidden>Go to sign in →</a>
    </main>
    <p class="door-foot"><svg class="door-lock" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 7V5a3 3 0 0 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7Zm1.5 0h3V5a1.5 1.5 0 0 0-3 0Z"/></svg>Runs on your own computer. Only you and the people you invite get in.</p>
    <script type="module" src="./join.ts"></script>
  </body>
</html>
